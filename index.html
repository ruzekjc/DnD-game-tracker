<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>DnD Character Inventory</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
  <div class="dm-bar">
    <div id="google-signin-btn"></div>
    <div id="dm-status" class="dm-status"></div>
    <div id="reconnect-banner" class="reconnect-banner" style="display: none;">
      <span class="reconnect-count"></span>
      <button class="reconnect-btn import-btn">Reconnect</button>
      <button class="reconnect-dismiss-btn import-btn">Dismiss</button>
    </div>
  </div>
  <div class="app-layout">
    <div id="app">
      <div class="char-panel-toolbar">
        <div class="char-panel-actions">
          <button id="import-characters-btn" class="import-btn">+ Import</button>
          <button id="new-character-btn" class="import-btn">+ New Character</button>
          <button id="char-edit-btn" class="import-btn char-edit-btn" type="button" disabled>✏️ Edit</button>
          <button id="char-save-btn" class="import-btn char-save-btn" type="button" disabled>💾 Save</button>
          <button id="char-close-btn" class="import-btn char-close-btn" type="button" disabled>✕ Close</button>
        </div>
        <div class="char-nav">
          <button id="char-prev-btn" class="nav-arrow-btn" type="button">←</button>
          <select id="char-select"></select>
          <button id="char-next-btn" class="nav-arrow-btn" type="button">→</button>
        </div>
      </div>
      <div id="char-display"></div>
    </div>
    <div id="resizer-vertical" class="resizer resizer-vertical"></div>
    <div id="shop-enemy-app"></div>
    <div id="resizer-horizontal" class="resizer resizer-horizontal"></div>
    <div id="bottom-panel-app"></div>
  </div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
